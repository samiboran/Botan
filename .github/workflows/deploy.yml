name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/dragonkick-game-design-tjo3lc]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # DragonKick — repo root, served at /Botan/
      - name: Build DragonKick
        run: |
          npm ci
          npm run build

      # Platform Football — subfolder, served at /Botan/platform-football/
      - name: Build Platform Football
        working-directory: platform-football
        run: |
          npm ci
          npm run build

      # Combine both builds into one Pages artifact. DragonKick's dist is
      # the site root; Platform Football's dist nests under its own path
      # so the two apps never overwrite each other's files.
      - name: Combine builds
        run: |
          mkdir -p combined
          cp -r dist/. combined/
          mkdir -p combined/platform-football
          cp -r platform-football/dist/. combined/platform-football/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: combined

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
